<style>
:root{
  --rosa:#ff6bd6; --rosa2:#ff2e9a; --lila:#b388ff; --fondo:#0a0018;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* para las visitas: sin seleccionar textos ni arrastrar imágenes (el admin sí puede) */
body.protegido{
  -webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;
  -webkit-touch-callout:none;
}
body.protegido img,body.protegido video,body.protegido svg{-webkit-user-drag:none;user-drag:none}
body.protegido input[type=range]{-webkit-user-select:auto;user-select:auto}
html,body{margin:0;height:100%;background:var(--fondo);overflow:hidden;font-family:'Segoe UI',Arial,sans-serif;color:#fff}
/* la galaxia SOLO se ve dentro de la galaxia: así nunca se asoma detrás
   del inicio ni de Jeniflix mientras algo se desvanece */
canvas#c{display:none;position:fixed;inset:0}
body.iniciado canvas#c{display:block}

/* ---------- PANTALLA DE ENTRADA ---------- */
#intro{
  position:fixed;inset:0;z-index:5000;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:26px;text-align:center;padding:24px;
  background:radial-gradient(ellipse at 50% 40%, #2a0a4a 0%, #12002b 55%, #05000f 100%);
  transition:opacity 1.2s ease, visibility 1.2s;
}
#intro.oculto{opacity:0;visibility:hidden;pointer-events:none}
/* hasta que cargan los datos, el contenido está invisible: evita ver los textos por defecto */
#intro > *{opacity:0;transition:opacity .5s ease}
body.datos-listos #intro > *{opacity:1}
/* al cambiar de pantalla no debe haber ninguna animación de por medio:
   si algo se desvanece, se alcanza a ver lo que hay detrás */
body.restaurando #intro,body.restaurando #intro > *,body.restaurando #cargando,
body.restaurando #netflixUI,body.restaurando #playerVideo,
body.restaurando .sticker,body.restaurando #topbar,body.restaurando #player,
body.restaurando #hint{transition:none!important}
#cargando{
  position:fixed;inset:0;z-index:5200;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at 50% 40%, #2a0a4a 0%, #12002b 55%, #05000f 100%);
  transition:opacity .6s ease, visibility .6s;
}
body.datos-listos #cargando{opacity:0;visibility:hidden}
.corazon-svg{display:block;filter:drop-shadow(0 0 14px rgba(255,46,154,.85))}
#cargando .lat{width:62px;height:56px;animation:latido 1.1s ease-in-out infinite}
/* fondo personalizado de la portada */
#intro.con-fondo{background:var(--fondo-portada) center/cover no-repeat}
#intro.con-fondo::before{
  content:"";position:absolute;inset:0;background:rgba(8,0,20,.62);backdrop-filter:blur(1px);
}
#intro.con-fondo > *{position:relative;z-index:1}
#intro .kitty-intro{width:130px;height:130px;animation:flotar 3s ease-in-out infinite}
#intro h1{
  margin:0;font-size:clamp(28px,7vw,54px);font-weight:800;letter-spacing:1px;
  background:linear-gradient(90deg,#ff6bd6,#ffd1ec,#b388ff,#ff6bd6);
  background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:brillo-texto 5s linear infinite;
}
#intro p{margin:0;max-width:520px;color:#e8d7ff;font-size:clamp(15px,4vw,19px);line-height:1.6}
#btnEntrar{
  border:none;cursor:pointer;padding:16px 42px;border-radius:999px;font-size:18px;font-weight:700;color:#fff;
  background:linear-gradient(135deg,var(--rosa2),var(--lila));
  box-shadow:0 0 25px rgba(255,46,154,.7),0 0 60px rgba(179,136,255,.4);
  transition:transform .25s, box-shadow .25s;animation:latido 1.6s ease-in-out infinite;
}
#btnEntrar:hover{transform:scale(1.08)}
@keyframes latido{0%,100%{transform:scale(1)}25%{transform:scale(1.06)}40%{transform:scale(1)}60%{transform:scale(1.06)}}
@keyframes brillo-texto{0%{background-position:0 0}100%{background-position:300% 0}}
/* los gatitos flotan derechos: la inclinación los hacía verse chuecos */
@keyframes flotar{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
#intro small{color:#9f86c9;font-size:12px}
.pregunta-intro{color:#c9a6ff!important;font-size:15px!important;letter-spacing:.5px}

/* ---------- CUADROS DE SELECCIÓN ---------- */
#tiles{display:flex;gap:26px;justify-content:center;flex-wrap:wrap}
.tile{display:flex;flex-direction:column;align-items:center;gap:10px;cursor:pointer;user-select:none}
.tile span{font-size:14px;color:#bfa8e8;transition:color .25s}
.tile:hover span{color:#fff}
.tile-cara{
  width:130px;height:130px;border-radius:14px;display:flex;align-items:center;justify-content:center;
  transition:transform .25s, box-shadow .25s;border:2px solid transparent;
}
.tile:hover .tile-cara{transform:scale(1.1)}
.tile-n .tile-cara{background:#000;box-shadow:0 0 22px rgba(229,9,20,.45)}
.tile-n:hover .tile-cara{border-color:#e50914;box-shadow:0 0 40px rgba(229,9,20,.8)}
.tile-n svg{width:62px;height:74px}
.tile-q .tile-cara{background:linear-gradient(160deg,#241040,#12002b);box-shadow:0 0 22px rgba(179,136,255,.4)}
.tile-q:hover .tile-cara{border-color:var(--lila);box-shadow:0 0 40px rgba(179,136,255,.8)}
.tile-q .tile-cara{position:relative}
.candado{font-size:52px;filter:drop-shadow(0 0 12px rgba(179,136,255,.8))}
.interrogacion{
  position:absolute;top:8px;right:12px;
  font-size:34px;font-weight:800;color:var(--lila);text-shadow:0 0 18px var(--lila);
  animation:pulso-q 2s ease-in-out infinite;
}
@keyframes pulso-q{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.18)}}
@media (max-width:600px){ .tile-cara{width:104px;height:104px} .tile-n svg{width:48px;height:58px} .candado{font-size:42px} .interrogacion{font-size:27px} }

/* ---------- MODO NETFLIX ---------- */
#netflixUI{
  position:fixed;inset:0;z-index:4600;background:#0b0b0b;display:none;flex-direction:column;
}
#netflixUI.abierta{display:flex}
#netflixUI header{
  display:flex;align-items:center;justify-content:space-between;padding:16px 22px;
  background:linear-gradient(#000,rgba(0,0,0,0));
}
.logo-flix{
  font-size:26px;font-weight:900;letter-spacing:3px;color:#e50914;
  text-shadow:0 0 18px rgba(229,9,20,.55);font-family:'Arial Black',Arial,sans-serif;
  cursor:pointer;user-select:none;transition:transform .2s,text-shadow .2s;
}
.logo-flix:hover{transform:scale(1.06);text-shadow:0 0 26px rgba(229,9,20,.9)}
.logo-flix:active{transform:scale(.98)}
#btnVolverFlix{
  border:1px solid #444;background:rgba(255,255,255,.06);color:#ddd;padding:9px 18px;border-radius:999px;
  font-size:14px;cursor:pointer;transition:all .2s;
}
#btnVolverFlix:hover{background:rgba(255,255,255,.15);color:#fff}
#flixContenido{flex:1;overflow-y:auto;padding:10px 22px 40px}
#flixContenido h3{color:#fff;font-size:18px;margin:10px 0 16px}
#gridVideos{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px}
@media (max-width:700px){ #gridVideos{grid-template-columns:1fr;gap:16px} }
.card-video{
  position:relative;border-radius:10px;overflow:hidden;cursor:pointer;background:#1a1a1a;
  aspect-ratio:16/9;border:2px solid transparent;transition:transform .25s,border-color .25s,box-shadow .25s;
}
.card-video:hover{transform:scale(1.06);border-color:#e50914;box-shadow:0 6px 30px rgba(229,9,20,.35);z-index:2}
.card-video video,.card-video img.portada{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.card-video .play-ico{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,.25);opacity:.9;transition:opacity .2s;
}
.card-video .play-ico svg{
  width:66px;height:66px;filter:drop-shadow(0 3px 12px rgba(0,0,0,.75));
  transition:transform .2s;
}
.card-video:hover .play-ico{opacity:1}
.card-video:hover .play-ico svg{transform:scale(1.12)}
@media (max-width:700px){ .card-video .play-ico svg{width:58px;height:58px} }
.card-video .pie-video{
  position:absolute;left:0;right:0;bottom:0;padding:30px 14px 11px;
  background:linear-gradient(transparent,rgba(0,0,0,.92));
}
.card-video .nombre-video{
  font-size:15.5px;font-weight:600;color:#fff;line-height:1.25;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  text-shadow:0 1px 6px rgba(0,0,0,.8);
}
.card-video .anio{
  display:inline-block;margin-top:6px;padding:2px 9px;border-radius:6px;
  font-size:11.5px;font-weight:700;letter-spacing:.6px;color:#d8d8d8;
  background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.24);
}
#sinVideos{color:#888;font-size:15px;text-align:center;margin-top:60px;display:none}
#flixCabecera{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:10px 0 16px}
#flixCabecera h3{margin:0}
#btnVistas{
  border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.08);color:#ddd;
  padding:8px 16px;border-radius:999px;font-size:13.5px;cursor:pointer;transition:all .2s;
}
#btnVistas:hover{background:rgba(255,255,255,.18);color:#fff}
#btnVistas.activo{background:rgba(20,120,60,.85);border-color:rgba(74,222,128,.6);color:#dcffe9}

/* ---- para ver en la tele con el control ---- */
.card-video:focus,#btnVistas:focus,#btnVolverFlix:focus,.logo-flix:focus,
#controles button:focus,#cerrarVideo:focus,.tile:focus{
  outline:3px solid #fff;outline-offset:3px;
}
/* el recuadro es para navegar con el control de la tele: si se está
   usando el dedo o el mouse, estorba y no debe aparecer */
body.con-puntero .card-video:focus,body.con-puntero #btnVistas:focus,
body.con-puntero #btnVolverFlix:focus,body.con-puntero .logo-flix:focus,
body.con-puntero #controles button:focus,body.con-puntero #cerrarVideo:focus,
body.con-puntero .tile:focus,body.con-puntero .chip:focus{
  outline:none;
}
body.con-puntero .card-video:focus{transform:none}
.card-video:focus{transform:scale(1.06);z-index:3}
.card-video:focus-visible{outline:4px solid #e50914;outline-offset:4px}
/* algunas teles y iOS pintan su propio boton de play gigante sobre el video:
   lo quitamos para que no tape la portada ni el reproductor */
video::-webkit-media-controls,
video::-webkit-media-controls-enclosure,
video::-webkit-media-controls-panel,
video::-webkit-media-controls-start-playback-button,
video::-webkit-media-controls-overlay-play-button{
  display:none!important;-webkit-appearance:none;opacity:0!important;
}
.card-video .visto{
  display:none;position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.3);
}
.card-video .visto span{display:block;height:100%;width:0%;background:#e50914}
.card-video .sinPortada{
  background:#000;display:flex;align-items:center;justify-content:center;
}
.card-video .sinPortada span{
  color:rgba(255,255,255,.42);font-size:19px;font-weight:800;letter-spacing:5px;
  text-transform:uppercase;
}
.card-video.vista{opacity:.62}
.card-video.vista:hover{opacity:1}
.card-video .sello{
  position:absolute;top:8px;left:8px;background:rgba(20,120,60,.92);color:#dcffe9;
  font-size:11.5px;font-weight:700;padding:4px 10px 4px 7px;border-radius:999px;letter-spacing:.3px;
  display:flex;align-items:center;gap:3px;
}
.card-video .sello svg{width:14px;height:14px;flex:none}

/* ---------- REPRODUCTOR DE VIDEO ---------- */
#playerVideo{
  position:fixed;inset:0;z-index:6500;background:#000;display:none;align-items:center;justify-content:center;
}
#playerVideo.abierto{display:flex}
#playerVideo{cursor:default}
#playerVideo.sin-cursor{cursor:none}
#vid{width:100%;height:100%;max-height:100vh;object-fit:contain;background:#000;outline:none}
/* reproductores incrustados (ok.ru, YouTube…): ocupan todo y traen sus propios controles */
#marcoVideo{display:none;width:100%;height:100%;border:0;background:#000}
#playerVideo.incrustado #vid,
#playerVideo.incrustado #controles,
#playerVideo.incrustado #playGigante,
#playerVideo.incrustado #cargandoVid{display:none!important}
#playerVideo.incrustado #marcoVideo{display:block}
#playerVideo.incrustado #capaSuperior{opacity:1!important;pointer-events:auto!important}

/* capa superior: título y cerrar */
#capaSuperior{
  position:absolute;top:0;left:0;right:0;z-index:20;padding:16px 20px;display:flex;align-items:center;gap:16px;
  background:linear-gradient(rgba(0,0,0,.75),transparent);
  transition:opacity .3s;
}
#playerVideo.ocultar-ui #capaSuperior,#playerVideo.ocultar-ui #controles{opacity:0;pointer-events:none}
#cerrarVideo{
  border:none;background:rgba(255,255,255,.14);color:#fff;width:42px;height:42px;min-width:42px;
  border-radius:50%;font-size:18px;cursor:pointer;transition:background .2s,transform .2s;
}
#cerrarVideo:hover{background:#e50914;transform:scale(1.08)}
#tituloReproduciendo{
  color:#fff;font-size:19px;font-weight:600;text-shadow:0 2px 12px rgba(0,0,0,.9);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  display:flex;align-items:center;gap:10px;min-width:0;
}
#tituloReproduciendo > span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#tituloReproduciendo .anioArriba{
  flex:none;font-size:12px;font-weight:700;letter-spacing:.6px;color:#d8d8d8;
  padding:2px 9px;border-radius:6px;text-shadow:none;
  background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);
}

/* botón gigante de play */
#playGigante{
  position:absolute;z-index:18;left:50%;top:50%;transform:translate(-50%,-50%);
  width:88px;height:88px;border-radius:50%;border:none;cursor:pointer;color:#fff;
  background:rgba(229,9,20,.9);box-shadow:0 6px 30px rgba(0,0,0,.6);
  display:none;align-items:center;justify-content:center;transition:transform .2s,background .2s;
}
#playerVideo.pausado #playGigante{display:flex}
#playGigante:hover{transform:translate(-50%,-50%) scale(1.1);background:#e50914}
#playGigante svg{width:44px;height:44px}

/* spinner de carga */
#cargandoVid{position:absolute;z-index:17;left:50%;top:50%;transform:translate(-50%,-50%);display:none}
#playerVideo.cargando #cargandoVid{display:block}
#playerVideo.cargando #playGigante{display:none}
#cargandoVid .aro{
  width:56px;height:56px;border-radius:50%;
  border:4px solid rgba(255,255,255,.18);border-top-color:#e50914;
  animation:girarAro .8s linear infinite;
}
@keyframes girarAro{to{transform:rotate(360deg)}}

/* avisos del modo party (llegan desde el panel) */
.avisoParty{
  position:fixed;z-index:9500;max-width:min(80vw,620px);padding:14px 24px;border-radius:16px;
  background:rgba(10,0,24,.86);border:1px solid rgba(255,107,214,.6);
  box-shadow:0 8px 40px rgba(0,0,0,.7),0 0 30px rgba(255,46,154,.35);
  font-weight:600;line-height:1.35;text-align:center;white-space:pre-wrap;
  opacity:0;transform:translateY(14px) scale(.94);transition:opacity .4s,transform .4s;
  pointer-events:none;backdrop-filter:blur(8px);
}
.avisoParty.visible{opacity:1;transform:translateY(0) scale(1)}
.avisoParty .fotoAviso{
  display:block;max-width:min(60vw,420px);max-height:44vh;width:auto;
  border-radius:12px;margin:0 auto 10px;border:1px solid rgba(255,107,214,.5);
  box-shadow:0 6px 24px rgba(0,0,0,.6);
}
.avisoParty.pos-arriba-izq{top:22px;left:22px;text-align:left}
.avisoParty.pos-arriba{top:22px;left:50%;transform:translate(-50%,14px) scale(.94)}
.avisoParty.pos-arriba.visible{transform:translate(-50%,0) scale(1)}
.avisoParty.pos-arriba-der{top:22px;right:22px;text-align:right}
.avisoParty.pos-izq{top:50%;left:22px;transform:translateY(-50%) scale(.94);text-align:left}
.avisoParty.pos-izq.visible{transform:translateY(-50%) scale(1)}
.avisoParty.pos-centro{top:50%;left:50%;transform:translate(-50%,-46%) scale(.94)}
.avisoParty.pos-centro.visible{transform:translate(-50%,-50%) scale(1)}
.avisoParty.pos-der{top:50%;right:22px;transform:translateY(-50%) scale(.94);text-align:right}
.avisoParty.pos-der.visible{transform:translateY(-50%) scale(1)}
.avisoParty.pos-abajo-izq{bottom:22px;left:22px;text-align:left}
.avisoParty.pos-abajo{bottom:22px;left:50%;transform:translate(-50%,14px) scale(.94)}
.avisoParty.pos-abajo.visible{transform:translate(-50%,0) scale(1)}
.avisoParty.pos-abajo-der{bottom:22px;right:22px;text-align:right}

/* aviso de "continuando desde…" */
#avisoReanuda{
  position:absolute;z-index:21;left:50%;bottom:110px;transform:translate(-50%,12px);
  background:rgba(0,0,0,.82);border:1px solid rgba(229,9,20,.7);color:#fff;
  padding:10px 20px;border-radius:999px;font-size:14px;white-space:nowrap;
  opacity:0;pointer-events:none;transition:opacity .35s,transform .35s;
  box-shadow:0 4px 20px rgba(0,0,0,.6);
}
#avisoReanuda.visible{opacity:1;transform:translate(-50%,0)}

/* controles inferiores */
#controles{
  position:absolute;left:0;right:0;bottom:0;z-index:20;padding:0 20px 14px;
  background:linear-gradient(transparent,rgba(0,0,0,.55) 35%,rgba(0,0,0,.92));
  transition:opacity .3s;
}
#barraTiempo{padding:14px 0 6px;cursor:pointer}
#pistaTiempo{position:relative;height:5px;background:rgba(255,255,255,.28);border-radius:999px;transition:height .15s}
#barraTiempo:hover #pistaTiempo{height:8px}
#bufferTiempo{position:absolute;inset:0;width:0%;background:rgba(255,255,255,.35);border-radius:999px}
#progresoTiempo{position:absolute;inset:0;width:0%;background:#e50914;border-radius:999px}
#perilla{
  position:absolute;right:-7px;top:50%;transform:translateY(-50%) scale(0);
  width:14px;height:14px;border-radius:50%;background:#e50914;box-shadow:0 0 8px rgba(229,9,20,.9);
  transition:transform .15s;
}
#barraTiempo:hover #perilla{transform:translateY(-50%) scale(1)}
#botonera{display:flex;align-items:center;gap:14px;padding-bottom:4px}
#botonera button{
  background:none;border:none;color:#fff;cursor:pointer;padding:4px;display:flex;align-items:center;
  transition:transform .18s,color .18s;
}
#botonera button:hover{color:#e50914;transform:scale(1.15)}
#botonera svg{width:26px;height:26px}
#tiempos{color:#ddd;font-size:13.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
/* botón de subtítulos: encendido en blanco, apagado en gris */
#btnCC.apagado{color:#8b8b8b;opacity:.75}
#btnCC:not(.apagado){color:#fff}
#btnCC:not(.apagado)::after{
  content:"";position:absolute;bottom:-3px;left:50%;transform:translateX(-50%);
  width:16px;height:2.5px;border-radius:2px;background:#e50914;
}
#btnCC{position:relative}
/* aspecto de los subtítulos sobre el video */
#vid::cue{
  background:rgba(0,0,0,.72);color:#fff;font-size:1em;line-height:1.35;
  font-family:'Segoe UI',Arial,sans-serif;text-shadow:0 1px 3px rgba(0,0,0,.9);
}
.flexible{flex:1}
#zonaVolumen{display:flex;align-items:center;gap:6px}
#volumen{
  width:0;opacity:0;transition:width .25s,opacity .25s;accent-color:#e50914;cursor:pointer;height:4px;
}
#zonaVolumen:hover #volumen{width:80px;opacity:1}
@media (max-width:600px){
  #botonera{gap:9px}
  #botonera svg{width:23px;height:23px}
  #tiempos{font-size:12px}
  #zonaVolumen #volumen{display:none}
  #tituloReproduciendo{font-size:15px}
}

/* ---------- ANIMACIÓN N ---------- */
#nOverlay{

(async function arranque() {
  try {
    const cred = window.GALAXIA_SUPABASE;
    if (cred && cred.url && cred.url.indexOf("https") === 0 && window.supabase) {
      const sb = window.supabase.createClient(cred.url, cred.anonKey);
      SB = sb;
      const [cfgRes, sesRes] = await Promise.all([
        sb.from("galaxia_config").select("data").eq("id", 1).maybeSingle(),
        sb.auth.getSession()
      ]);
      ES_ADMIN = !!(sesRes.data && sesRes.data.session);
      if (cfgRes.data && cfgRes.data.data && Object.keys(cfgRes.data.data).length) {
        CONFIG = Object.assign({}, DEFAULTS, cfgRes.data.data);
      }
    }
  } catch (e) {
    console.warn("Supabase no disponible, usando valores locales:", e);
  }
  try {
    const [rv, rf] = await Promise.all([
      fetch("/api/archivos?carpeta=videos"),
      Promise.resolve({ ok: false })     // las fotos son cosa de galaxia.html
    ]);
    if (rv.ok) {
      VIDEOS = ((await rv.json()).archivos || []).map(a => Object.assign({ origen: "b2" }, a));
      // videos agregados por link desde el panel
      (CONFIG.videosLink || []).forEach(l => VIDEOS.push({
        origen: "link", fileName: l.id, url: l.url, embed: !!l.embed,
        nombre: l.nombre || l.url, tam: 0
      }));
      // orden del panel: pendientes primero (por su orden), terminadas al final
      const meta = CONFIG.videosMeta || {};
      VIDEOS.sort((a, b) => {
        const ma = meta[a.fileName] || {}, mb = meta[b.fileName] || {};
        if (!!ma.terminada !== !!mb.terminada) return ma.terminada ? 1 : -1;
        // sin orden asignado = recién subido: va hasta arriba
        // (la API las entrega de más nueva a más vieja y el orden se respeta)
        const oa = ma.orden === undefined ? -1 : ma.orden;
        const ob = mb.orden === undefined ? -1 : mb.orden;
        return oa - ob;
      });
      VIDEOS.forEach(v => {
        const m = meta[v.fileName] || {};
        v.terminada = !!m.terminada;
        v.titulo = m.titulo || "";
        v.miniatura = m.miniatura || "";
        v.subtitulo = m.subtitulo || "";
      });
    }
    /* las fotos son de la galaxia (galaxia.html): aquí no se piden */
  } catch (e) {
    console.warn("No se pudieron cargar los archivos:", e);
  }

})();

/* --- sonido "tudum" sintetizado (sin archivos externos) --- */
function sonidoTudum() {
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    const ac = new AC();
    const golpe = (t0, frec, dur, vol) => {
      const osc = ac.createOscillator(), g = ac.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(frec, t0);
      osc.frequency.exponentialRampToValueAtTime(frec * .55, t0 + dur);
      g.gain.setValueAtTime(0, t0);
      g.gain.linearRampToValueAtTime(vol, t0 + .012);
      g.gain.exponentialRampToValueAtTime(.001, t0 + dur);
      osc.connect(g); g.connect(ac.destination);
      osc.start(t0); osc.stop(t0 + dur + .05);
    };
    const t = ac.currentTime + .05;
    golpe(t, 155, .30, .45);          // "tu"
    golpe(t + .26, 104, .95, .55);    // "dum"
    golpe(t + .26, 52, 1.0, .35);     // grave de apoyo
  } catch (e) { /* sin sonido, no pasa nada */ }
}

let huellaDatos = "";

async function traerDatosFrescos() {
  const cred = window.GALAXIA_SUPABASE || {};

  if (SB) {
    const r = await SB.from("galaxia_config").select("data").eq("id", 1).maybeSingle();
    if (r && r.data && r.data.data) nuevo.cfg = r.data.data;
  }
  const rv = await fetch("/api/archivos?carpeta=videos&t=" + Date.now(), { cache: "no-store" });
  if (rv.ok) nuevo.videos = (await rv.json()).archivos || [];
  const rf = await fetch("/api/archivos?carpeta=fotos&t=" + Date.now(), { cache: "no-store" });
  if (rf.ok) nuevo.fotos = ((await rf.json()).archivos || []).map(f => f.url);
  return nuevo;
}

function armarVideos(lista, meta) {
  const salida = (lista || []).map(a => Object.assign({ origen: "b2" }, a));
  (CONFIG.videosLink || []).forEach(l => salida.push({

  }));

    const ma = meta[a.fileName] || {}, mb = meta[b.fileName] || {};
    if (!!ma.terminada !== !!mb.terminada) return ma.terminada ? 1 : -1;
    const oa = ma.orden === undefined ? -1 : ma.orden;
    const ob = mb.orden === undefined ? -1 : mb.orden;
    return oa - ob;
  });
  salida.forEach(v => {
    const m = meta[v.fileName] || {};
    v.terminada = !!m.terminada;
    v.titulo = m.titulo || "";
    v.miniatura = m.miniatura || "";
    v.subtitulo = m.subtitulo || "";
  });
  return salida;
}

async function revisarCambios(forzar) {
  // si están viendo algo, no se toca nada hasta que cierren
  if (playerVideo.classList.contains("abierto")) return;
  let d;
  try { d = await traerDatosFrescos(); } catch (e) { return; }
  if (!d.videos) return;

  const cfg = d.cfg || {};
  const huella = JSON.stringify([cfg.videosMeta, cfg.videosLink, cfg.flixTitulo,
    cfg.flixLogo, cfg.flixEtiqueta, d.videos.map(v => v.fileName)]);
  if (!forzar && huella === huellaDatos) return;
  huellaDatos = huella;

  CONFIG = Object.assign({}, DEFAULTS, cfg);
  VIDEOS = armarVideos(d.videos, CONFIG.videosMeta || {});


  document.getElementById("flixTitulo").textContent = CONFIG.flixTitulo || DEFAULTS.flixTitulo;
  document.getElementById("logoFlix").textContent = CONFIG.flixLogo || DEFAULTS.flixLogo;
  document.getElementById("etiquetaFlix").textContent = CONFIG.flixEtiqueta || DEFAULTS.flixEtiqueta;
  if (netflixUI.classList.contains("abierta")) pintarVideos();
}

/* Separa el año del final del título: "Ven Y Mira 1985" → {titulo, anio}.
   Acepta también entre paréntesis: "Frágiles (2005)". */
function separarAnio(txt) {
  const t = String(txt || "").trim();
  const m = t.match(/^(.*?)[\s\-–—_]*\(?((?:19|20)\d{2})\)?$/);
  if (m && m[1].trim()) return { titulo: m[1].trim().replace(/[\s\-–—_:]+$/, ""), anio: m[2] };
  return { titulo: t, anio: "" };
}

/* título del reproductor: el año va como etiqueta, igual que en las tarjetas */
function ponerTituloArriba(v) {
  const cont = document.getElementById("tituloReproduciendo");
  const s = separarAnio(v.titulo || v.nombre);
  cont.innerHTML = "";
  const t = document.createElement("span");
  t.textContent = s.titulo;
  cont.appendChild(t);
  if (s.anio) {
    const a = document.createElement("span");
    a.className = "anioArriba";
    a.textContent = s.anio;
    cont.appendChild(a);
  }
}

function reloj(s) {
  if (!isFinite(s) || s < 0) return "0:00";
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), g = Math.floor(s % 60);
  return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(g).padStart(2, "0");
}

/* --- memoria de dónde se quedó cada video --- */
const CLAVE_VISTOS = "jeniflix_vistos";
let videoActual = null;

function leerVistos() {
  try { return JSON.parse(localStorage.getItem(CLAVE_VISTOS) || "{}"); }
  catch (e) { return {}; }
}
function guardarPosicion() {
  if (!videoActual || !isFinite(vid.duration) || vid.duration < 30) return;
  const vistos = leerVistos();
  // si ya casi termina, se olvida para que la próxima empiece de cero
  if (vid.currentTime > vid.duration - 15 || vid.currentTime < 5) delete vistos[videoActual];
  else vistos[videoActual] = { t: Math.floor(vid.currentTime), d: Math.floor(vid.duration) };
  try { localStorage.setItem(CLAVE_VISTOS, JSON.stringify(vistos)); } catch (e) {}
}

/* devuelve {t, d} aceptando también el formato viejo (solo número) */
function posicionDe(clave) {
  const r = leerVistos()[clave];
  if (r === undefined) return null;
  return typeof r === "number" ? { t: r, d: 0 } : r;
}

/* ---------- SUBTÍTULOS ---------- */
const btnCC = document.getElementById("btnCC");
const CLAVE_SUBS = "jeniflix_subs";
let urlPistaSub = null;

// vienen activados salvo que ella los haya apagado
function subsEncendidos() { try { return localStorage.getItem(CLAVE_SUBS) !== "0"; } catch (e) { return true; } }

/* Los sube un poco: por defecto quedan pegados al borde de abajo,
   tapados por la barra de controles. -3 = tres renglones más arriba. */
function acomodarSubs() {
  for (const t of vid.textTracks) {
    if (!t.cues) continue;
    for (const c of t.cues) {
      try { c.snapToLines = true; c.line = -3; } catch (e) {}
    }
  }
}

function aplicarModoSubs() {
  const on = subsEncendidos();
  for (const t of vid.textTracks) t.mode = on ? "showing" : "hidden";
  acomodarSubs();
  btnCC.classList.toggle("apagado", !on);
  btnCC.title = on ? "Ocultar subtítulos (C)" : "Mostrar subtítulos (C)";
}

function quitarSubtitulos() {
  vid.querySelectorAll("track").forEach(t => t.remove());
  if (urlPistaSub) { URL.revokeObjectURL(urlPistaSub); urlPistaSub = null; }
  btnCC.style.display = "none";
}

/* Se descarga el archivo y se sirve como blob local: así el navegador no
   rechaza la pista por venir de otro dominio (Backblaze). */
async function cargarSubtitulos(url) {
  quitarSubtitulos();
  if (!url) return;
  try {
    const r = await fetch(url);
    if (!r.ok) return;
    let txt = await r.text();
    if (!/^WEBVTT/.test(txt.trim())) {
      txt = "WEBVTT\n\n" + txt.replace(/\r\n?/g, "\n")
        .replace(/(\d{1,2}:\d{2}:\d{2}),(\d{1,3})/g, "$1.$2").trim() + "\n";
    }
    urlPistaSub = URL.createObjectURL(new Blob([txt], { type: "text/vtt" }));
    const track = document.createElement("track");
    track.kind = "subtitles";
    track.label = "Español";
    track.srclang = "es";
    track.default = true;
    track.src = urlPistaSub;
    track.addEventListener("load", aplicarModoSubs);
    vid.appendChild(track);
    btnCC.style.display = "";
    aplicarModoSubs();
    setTimeout(aplicarModoSubs, 400);   // algunos navegadores tardan en registrarla
  } catch (e) { /* si falla, el video se ve igual sin subtítulos */ }
}

/* ============================================================
   🎉 MODO PARTY — ver juntos y avisos desde el panel
   Se sincroniza play, pausa y adelantos entre quienes estén viendo,
   usando el canal en tiempo real de Supabase.
   ============================================================ */
const MI_ID = Math.random().toString(36).slice(2, 9);
let canalSala = null;
let aplicandoRemoto = false;   // evita el eco: no reenviar lo que acaba de llegar

function emitirSala(evento, datos) {
  if (!canalSala) return;
  try { canalSala.send({ type: "broadcast", event: evento, payload: Object.assign({ de: MI_ID }, datos) }); }
  catch (e) {}
}

function avisoParty(texto) {
  mostrarAvisoParty({ texto, pos: "abajo", tam: 20, color: "#ffffff", dur: 3 });
}

function mostrarAvisoParty(a) {
  const el = document.createElement("div");
  el.className = "avisoParty pos-" + (a.pos || "centro");
  el.style.fontSize = (a.tam || 24) + "px";
  el.style.color = a.color || "#ffffff";

  if (a.img) {                       // foto que acompaña al mensaje
    const im = document.createElement("img");
    im.src = a.img; im.alt = ""; im.className = "fotoAviso";
    el.appendChild(im);
  }
  const texto = ((a.emoji ? a.emoji + " " : "") + (a.texto || "")).trim();
  if (texto) {
    const t = document.createElement("div");
    t.textContent = texto;
    el.appendChild(t);
  }
  // En pantalla completa el navegador SOLO dibuja lo que está dentro del
  // elemento ampliado: si lo colgamos del body, el aviso no se vería.
  contenedorAvisos().appendChild(el);
  setTimeout(() => el.classList.add("visible"), 20);
  setTimeout(() => {
    el.classList.remove("visible");
    setTimeout(() => el.remove(), 600);
  }, Math.max(1, a.dur || 6) * 1000);
}

function contenedorAvisos() {
  return document.fullscreenElement || document.webkitFullscreenElement || document.body;
}

/* si entran o salen de pantalla completa con un aviso puesto, se lo llevan */
function reubicarAvisos() {
  const destino = contenedorAvisos();
  document.querySelectorAll(".avisoParty").forEach(a => {
    if (a.parentNode !== destino) destino.appendChild(a);
  });
}
["fullscreenchange", "webkitfullscreenchange", "mozfullscreenchange", "MSFullscreenChange"]
  .forEach(ev => document.addEventListener(ev, reubicarAvisos));

async function aplicarEstadoRemoto(p) {
  if (!p || p.de === MI_ID) return;
  if (!playerVideo.classList.contains("abierto") || playerVideo.classList.contains("incrustado")) return;
  // SOLO obedece las órdenes que vienen del PANEL (botón "pausar/reanudar
  // a todos"). Ya NO se sincroniza automáticamente entre dos aparatos que
  // vean lo mismo: eso hacía un bucle infinito de pausa/reanuda.
  if (!p.dePanel) return;
  aplicandoRemoto = true;
  try {
    if (p.accion === "play") { await vid.play().catch(() => {}); }
    else if (p.accion === "pause") { vid.pause(); }
  } finally {
    setTimeout(() => { aplicandoRemoto = false; }, 600);
  }
}

/* ============================================================
   ⏱️ SINCRONIZAR LA POSICIÓN AL ENTRAR
   El que abre una película pregunta "¿alguien la está viendo y en
   qué minuto va?". Quien la esté viendo responde su minuto. Así el
   segundo entra sincronizado con el primero, en vez de empezar de
   cero. Esto NO fuerza play/pausa (por eso no hace bucle): solo
   comparte el minuto, una vez, al entrar.
   ============================================================ */
function preguntarPosicion(videoKey) {
  return new Promise(resolve => {
    if (!canalSala) return resolve(null);
    let resuelto = false;
    const alResponder = ({ payload }) => {
      if (resuelto || !payload || payload.de === MI_ID) return;
      if (payload.video !== videoKey || typeof payload.t !== "number") return;
      resuelto = true;
      resolve(payload.t + 0.3);            // +0.3s para compensar el instante que tardó
    };
    canalSala.on("broadcast", { event: "posicion" }, alResponder);
    // preguntar a quien esté viendo esta película
    try { canalSala.send({ type: "broadcast", event: "pregunta-pos", payload: { de: MI_ID, video: videoKey } }); } catch (e) {}
    // si nadie responde en 1.2s, se entra normal (desde donde uno la dejó)
    setTimeout(() => { if (!resuelto) { resuelto = true; resolve(null); } }, 1200);
  });
}

function unirseALaSala() {
  if (!SB || canalSala) return;
  try {
    canalSala = SB.channel("jeniflix-party", { config: { broadcast: { self: false } } });
    canalSala.on("broadcast", { event: "estado" }, ({ payload }) => aplicarEstadoRemoto(payload));
    // alguien pregunta en qué minuto va esta película: si la estoy viendo, respondo
    canalSala.on("broadcast", { event: "pregunta-pos" }, ({ payload }) => {
      if (!payload || payload.de === MI_ID) return;
      if (!playerVideo.classList.contains("abierto") || playerVideo.classList.contains("incrustado")) return;
      if (videoActual !== payload.video) return;
      try { canalSala.send({ type: "broadcast", event: "posicion", payload: { de: MI_ID, video: videoActual, t: vid.currentTime } }); } catch (e) {}
    });
    canalSala.on("broadcast", { event: "aviso" }, ({ payload }) => mostrarAvisoParty(payload || {}));
    // el panel avisa cuando guarda algo: así se ve al momento, sin recargar
    // si están viendo algo, el refresco espera: redibujar la lista a media
    // película se siente como un tirón en la tele
    canalSala.on("broadcast", { event: "refrescar" }, () => { if (!viendoAlgo()) revisarCambios(true); });
    // recarga completa a petición del panel (útil en la tele, donde recargar
    // a mano con el control es un fastidio)
    canalSala.on("broadcast", { event: "recargar" }, () => {
      if (playerVideo.classList.contains("abierto")) return;   // no cortar una película
      mostrarAvisoParty({ texto: "Actualizando…", pos: "abajo", tam: 18, dur: 2 });
      setTimeout(() => location.reload(), 700);
    });
    canalSala.subscribe();
  } catch (e) { canalSala = null; }
}

/* Ya NO se emite lo que uno hace con el video. Cada aparato reproduce
   independiente; solo el panel puede pausar/reanudar a todos a la vez.
   Así se acabó el bucle de "pausado/reanudado del otro lado". */

/* se entra a la sala desde el arranque, no solo al abrir una película:
   así llegan los avisos y las actualizaciones aunque estén en el menú */
unirseALaSala();

function cargarScript(url) {
  return new Promise((ok, mal) => {
    const s = document.createElement("script");
    s.src = url; s.onload = ok; s.onerror = mal;

}

/* ============================================================
   Pantalla completa según el equipo:
   · PC, Mac, Android e iPad → pantalla completa del contenedor
     (se conservan nuestros controles rojos estilo Netflix)
   · iPhone → solo permite pantalla completa sobre el <video>,
     y además exige que el video ya tenga datos cargados
   ============================================================ */
const pedirFS = playerVideo.requestFullscreen || playerVideo.webkitRequestFullscreen
             || playerVideo.mozRequestFullScreen || playerVideo.msRequestFullscreen;
const salirFS = document.exitFullscreen || document.webkitExitFullscreen
             || document.mozCancelFullScreen || document.msExitFullscreen;
const soloVideoFS = !pedirFS && !!vid.webkitEnterFullscreen;   // caso iPhone

function entrarPantallaCompleta() {
  if (pedirFS) {
    try {
      const p = pedirFS.call(playerVideo);
      if (p && p.catch) p.catch(() => {});
    } catch (e) {}
    return true;
  }
  return false;   // en iPhone se hará cuando el video tenga datos
}

function enPantallaCompleta() {
  return !!(document.fullscreenElement || document.webkitFullscreenElement
         || document.mozFullScreenElement || document.msFullscreenElement
         || vid.webkitDisplayingFullscreen);
}

const marcoVideo = document.getElementById("marcoVideo");

/* Los videos incrustados (ok.ru, YouTube…) traen su propio reproductor:
   se muestran en un marco y no aplican nuestros controles ni la memoria de posición. */
function abrirIncrustado(v) {
  playerVideo.classList.add("abierto", "incrustado");
  playerVideo.classList.remove("ocultar-ui", "cargando", "pausado");
  document.getElementById("tituloReproduciendo").textContent = v.titulo || v.nombre;
  const sep = v.url.indexOf("?") > -1 ? "&" : "?";
  marcoVideo.src = v.url + sep + "autoplay=1";
  entrarPantallaCompleta();
}

async function abrirVideo(v) {
  if (v.embed) return abrirIncrustado(v);

  // se pide aquí, aún dentro del clic del usuario (si no, el navegador lo bloquea)
  const fsListo = entrarPantallaCompleta();
  if (!fsListo && soloVideoFS) {
    // iPhone: hay que esperar a que el video cargue antes de poder abrirlo en grande
    const alCargar = () => {
      vid.removeEventListener("loadedmetadata", alCargar);
      try { vid.webkitEnterFullscreen(); } catch (e) {}
    };
    vid.addEventListener("loadedmetadata", alCargar);
  }
  ponerTituloArriba(v);
  playerVideo.classList.add("abierto", "cargando");
  yaReintente = false;            // cada película empieza con su intento limpio
  playerVideo.classList.remove("ocultar-ui");
  videoActual = v.fileName || v.url;
  // si iOS cierra la pestaña por memoria, al volver se retoma esta película
  recordarPantalla("video");
  try { localStorage.setItem("jeniflix_viendo", videoActual); } catch (e) {}

  unirseALaSala();

  if (hls) { hls.destroy(); hls = null; }
  const esHls = /\.m3u8(\?|$)/i.test(v.url);

  // IMPORTANTE: el video se carga y arranca AQUÍ MISMO, sin esperar nada.
  // En el iPad, si se pone el src o se llama a play() después de un "await",
  // Safari ya no lo considera parte del clic y bloquea la reproducción: se
  // quedaba el aro girando sin empezar nunca.
  if (esHls && !vid.canPlayType("application/vnd.apple.mpegurl")) {
    try {
      if (!window.Hls) await cargarScript("https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js");
      hls = new window.Hls();
      hls.loadSource(v.url);
      hls.attachMedia(vid);
    } catch (e) { vid.src = v.url; }
  } else {
    vid.src = v.url;
    vid.load();
  }

  cargarSubtitulos(v.subtitulo);   // si el video trae subtítulos, se activan solos

  vid.play().catch(() => {});   // si el navegador bloquea, queda el botón gigante
  moverRaton();

  // La sincronización se pregunta APARTE, sin frenar la reproducción: si
  // alguien más está viendo esta misma película, se salta a su minuto en
  // cuanto responda (un instante después).
  preguntarPosicion(videoActual).then(minutoDeLOtro => {
    if (minutoDeLOtro == null) return;                       // nadie más la ve
    if (videoActual !== (v.fileName || v.url)) return;        // ya cambió de película
    const saltar = () => {
      try { vid.currentTime = minutoDeLOtro; } catch (e) {}
      avisoReanudar("Sincronizado en " + reloj(minutoDeLOtro) + " ⏵");
    };
    if (vid.readyState >= 1) saltar();
    else vid.addEventListener("loadedmetadata", saltar, { once: true });
  });
}

function avisoReanudar(texto) {
  const t = document.getElementById("avisoReanuda");
  t.textContent = texto;
  t.classList.add("visible");
  clearTimeout(avisoReanudar._t);
  avisoReanudar._t = setTimeout(() => t.classList.remove("visible"), 3500);
}

function cerrarReproductor() {
  cerrandoAdrede = true;          // evita que el pausado automático se dispare al cerrar
  recordarPantalla("jeniflix");
  try { localStorage.removeItem("jeniflix_viendo"); } catch (e) {}
  if (playerVideo.classList.contains("incrustado")) {
    marcoVideo.removeAttribute("src");     // detiene el video del marco
    playerVideo.classList.remove("incrustado");
  }
  guardarPosicion();
  videoActual = null;
  vid.pause();
  if (hls) { hls.destroy(); hls = null; }
  quitarSubtitulos();
  vid.removeAttribute("src");
  vid.load();
  playerVideo.classList.remove("abierto", "cargando", "pausado", "ocultar-ui");
  if (enPantallaCompleta()) {
    try {
      if (vid.webkitDisplayingFullscreen && vid.webkitExitFullscreen) vid.webkitExitFullscreen();
      else if (salirFS) salirFS.call(document);
    } catch (e) {}
  }
  setTimeout(() => { cerrandoAdrede = false; }, 300);
}

function alternarPlay() { vid.paused ? vid.play().catch(() => {}) : vid.pause(); }

vid.addEventListener("play", () => { playerVideo.classList.remove("pausado"); btnPlay.innerHTML = ICONO_PAUSA; });
vid.addEventListener("pause", () => { playerVideo.classList.add("pausado"); btnPlay.innerHTML = ICONO_PLAY; mostrarUI(); });
vid.addEventListener("waiting", () => playerVideo.classList.add("cargando"));
vid.addEventListener("playing", () => playerVideo.classList.remove("cargando"));
vid.addEventListener("canplay", () => playerVideo.classList.remove("cargando"));
vid.addEventListener("loadedmetadata", () => { playerVideo.classList.remove("cargando"); pintarTiempo(); });
/* "timeupdate" salta unas 4 veces por segundo. Todo lo que se haga aquí se
   repite muchísimo, y en la Smart TV (que es lenta) eso le roba tiempo al
   video y se ve como tironcitos. Por eso:
   · guardar la posición se hace de verdad cada 5 s, no 4 veces seguidas
   · si los controles están escondidos, no se repinta la barra de tiempo */
let ultimoGuardado = 0;
vid.addEventListener("timeupdate", () => {
  if (!playerVideo.classList.contains("ocultar-ui")) pintarTiempo();
  if (!videoActual) return;
  const ahora = vid.currentTime;
  if (Math.abs(ahora - ultimoGuardado) >= 5) {
    ultimoGuardado = ahora;
    guardarPosicion();
  }
});
vid.addEventListener("pause", guardarPosicion);
addEventListener("beforeunload", guardarPosicion);
addEventListener("visibilitychange", () => { if (document.hidden) guardarPosicion(); });
vid.addEventListener("progress", () => {
  if (playerVideo.classList.contains("ocultar-ui")) return;   // controles escondidos: no repintar
  if (vid.buffered.length && vid.duration) {
    bufferTiempo.style.width = (vid.buffered.end(vid.buffered.length - 1) / vid.duration * 100) + "%";
  }
});
vid.addEventListener("ended", () => { playerVideo.classList.add("pausado"); mostrarUI(); });

/* ============================================================
   🔌 SI EL VIDEO FALLA DE VERDAD
   OJO: en el iPad/iPhone el evento "stalled" salta todo el tiempo
   aunque el video vaya bien (Safari pausa la descarga sola). Por eso
   aquí NO se escucha "stalled" ni se recarga el video en bucle: eso
   dejaba el aro girando para siempre sin llegar a reproducir nunca.
   Solo se actúa ante un error real, y UNA sola vez.
   ============================================================ */
let yaReintente = false;
vid.addEventListener("error", () => {
  if (!playerVideo.classList.contains("abierto") || playerVideo.classList.contains("incrustado")) return;
  if (!vid.error) return;                    // error real, no un aviso pasajero
  if (yaReintente) {                         // ya se intentó: avisar y no insistir
    playerVideo.classList.remove("cargando");
    document.getElementById("tituloReproduciendo").textContent = "No se pudo cargar el video 😢";
    return;
  }
  yaReintente = true;
  const desde = vid.currentTime || 0;
  try {
    vid.load();
    vid.addEventListener("loadedmetadata", () => {
      try { if (desde > 0) vid.currentTime = desde; } catch (e) {}
      vid.play().catch(() => {});
    }, { once: true });
  } catch (e) {}
});

function pintarTiempo() {
  const d = vid.duration || 0;
  progresoTiempo.style.width = (d ? vid.currentTime / d * 100 : 0) + "%";
  tiempos.textContent = reloj(vid.currentTime) + " / " + reloj(d);
}

btnPlay.innerHTML = ICONO_PLAY;
btnVol.innerHTML = ICONO_VOL;
btnPlay.addEventListener("click", alternarPlay);
playGigante.addEventListener("click", alternarPlay);
vid.addEventListener("click", alternarPlay);
vid.addEventListener("dblclick", pantallaCompleta);
document.getElementById("btnAtras").addEventListener("click", () => { vid.currentTime = Math.max(0, vid.currentTime - 10); });
document.getElementById("btnAdelante").addEventListener("click", () => { vid.currentTime = Math.min(vid.duration || 0, vid.currentTime + 10); });

btnVol.addEventListener("click", () => {
  vid.muted = !vid.muted;
  btnVol.innerHTML = vid.muted || !vid.volume ? ICONO_MUDO : ICONO_VOL;
  volumen.value = vid.muted ? 0 : vid.volume;
});
volumen.addEventListener("input", () => {
  vid.volume = +volumen.value;
  vid.muted = +volumen.value === 0;
  btnVol.innerHTML = vid.muted ? ICONO_MUDO : ICONO_VOL;
});

/* barra de tiempo: clic y arrastre */
let arrastrandoBarra = false;
function buscarEn(e) {
  const r = barraTiempo.getBoundingClientRect();
  const x = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
  const f = Math.max(0, Math.min(1, x / r.width));
  if (isFinite(vid.duration)) { vid.currentTime = f * vid.duration; pintarTiempo(); }
}
barraTiempo.addEventListener("mousedown", e => { arrastrandoBarra = true; buscarEn(e); });
addEventListener("mousemove", e => { if (arrastrandoBarra) buscarEn(e); });
addEventListener("mouseup", () => { arrastrandoBarra = false; });
barraTiempo.addEventListener("touchstart", e => { arrastrandoBarra = true; buscarEn(e); }, { passive: true });
barraTiempo.addEventListener("touchmove", e => { if (arrastrandoBarra) buscarEn(e); }, { passive: true });
barraTiempo.addEventListener("touchend", () => { arrastrandoBarra = false; }, { passive: true });

function pantallaCompleta() {
  if (enPantallaCompleta()) {
    // salida a propósito con nuestro botón (o la tecla F): NO debe pausar
    salidaConBoton = true;
    setTimeout(() => { salidaConBoton = false; }, 700);
    try {
      if (vid.webkitDisplayingFullscreen && vid.webkitExitFullscreen) vid.webkitExitFullscreen();
      else if (salirFS) salirFS.call(document);
    } catch (e) {}
  } else if (!entrarPantallaCompleta() && soloVideoFS) {
    try { vid.webkitEnterFullscreen(); } catch (e) {}
  }
}
document.getElementById("btnPantalla").addEventListener("click", pantallaCompleta);

/* al salir de pantalla completa se pausa solo */
function alSalirDePantallaCompleta() {
  if (cerrandoAdrede || salidaConBoton) return;   // salida a propósito: se sigue viendo
  if (!enPantallaCompleta() && playerVideo.classList.contains("abierto") && !vid.paused) {
    vid.pause();
  }
}
["fullscreenchange", "webkitfullscreenchange", "mozfullscreenchange", "MSFullscreenChange"].forEach(ev =>
  document.addEventListener(ev, alSalirDePantallaCompleta));
vid.addEventListener("webkitendfullscreen", alSalirDePantallaCompleta);   // iPhone

/* ocultar controles cuando no hay movimiento */
let tempUI = null;
function mostrarUI() {
  playerVideo.classList.remove("ocultar-ui", "sin-cursor");
  clearTimeout(tempUI);
}
function moverRaton() {
  mostrarUI();
  tempUI = setTimeout(() => {
    // si están navegando con el control de la tele, los controles no se esconden
    if (botonEnfocado() > -1) return;
    if (!vid.paused) playerVideo.classList.add("ocultar-ui", "sin-cursor");
  }, 3000);
}
playerVideo.addEventListener("mousemove", moverRaton);
playerVideo.addEventListener("touchstart", moverRaton, { passive: true });

document.getElementById("cerrarVideo").addEventListener("click", cerrarReproductor);
/* botones del reproductor que el control de la tele puede recorrer */
function botonesReproductor() {
  return [...playerVideo.querySelectorAll("#controles button, #cerrarVideo")]
    .filter(b => b.offsetParent !== null && getComputedStyle(b).display !== "none");
}
function botonEnfocado() {
  return botonesReproductor().indexOf(document.activeElement);
}

addEventListener("keydown", e => {
  if (!playerVideo.classList.contains("abierto")) return;
  const t = e.key.toLowerCase();
  const esOk = e.key === "Enter" || e.keyCode === 13;

  if (e.key === "Escape" || e.key === "Backspace" || e.keyCode === 27 || e.keyCode === 461) {
    e.preventDefault(); return cerrarReproductor();     // 461 = botón "atrás" de muchas smart TV
  }
  if (playerVideo.classList.contains("incrustado")) return;   // el marco maneja sus propias teclas

  const btns = botonesReproductor();
  const i = botonEnfocado();
  const enBoton = i > -1;
  moverRaton();                                   // cualquier tecla muestra los controles

  // OK: si hay un botón marcado lo activa; si no, pausa o reanuda (como en Netflix)
  if (esOk) {
    e.preventDefault();
    if (enBoton) document.activeElement.click();
    else alternarPlay();
    return;
  }

  if (e.key === " " || t === "k") { e.preventDefault(); alternarPlay(); return; }

  if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
    e.preventDefault();
    if (enBoton) {                                // moverse entre los botones
      const j = i + (e.key === "ArrowRight" ? 1 : -1);
      if (btns[j]) btns[j].focus();
    } else {                                      // sin botón marcado: adelantar o retroceder
      vid.currentTime = e.key === "ArrowRight"
        ? Math.min(vid.duration || 0, vid.currentTime + 10)
        : Math.max(0, vid.currentTime - 10);
    }
    return;
  }

  if (e.key === "ArrowDown") {
    e.preventDefault();
    if (!enBoton) { if (btns[0]) btns[0].focus(); }        // bajar a la barra de controles
    else { document.activeElement.blur(); }                // volver al modo "solo ver"
    return;
  }
  if (e.key === "ArrowUp") {
    e.preventDefault();
    if (enBoton) document.activeElement.blur();
    else if (btns[0]) btns[0].focus();
    return;
  }

  if (t === "f") pantallaCompleta();
  else if (t === "m") btnVol.click();
  else if (t === "c" && btnCC.style.display !== "none") btnCC.click();
});
function volverAlInicio() {
  sinTransicion(() => {
    netflixUI.classList.remove("abierta");
    document.getElementById("intro").classList.remove("oculto");
  });
  recordarPantalla("inicio");
}
document.getElementById("btnVolverFlix").addEventListener("click", volverAlInicio);
document.getElementById("logoFlix").addEventListener("click", volverAlInicio);

/* --- cuadro Netflix: tudum + animación de la N --- */
/* deja el foco en la primera película, para poder seguir con el control de la tele */
function enfocarPrimera() {
  const c = gridVideos.querySelector(".card-video");
  if (c) setTimeout(() => { try { c.focus({ preventScroll: true }); } catch (e) { c.focus(); } }, 120);
}

function entrarJeniflix(conAnimacion) {
  recordarPantalla("jeniflix");
  pintarVideos();
  document.getElementById("intro").classList.add("oculto");
  // OJO: no se deja ninguna película seleccionada al entrar. En la tele, el
  // primer OK del control abriría la que estuviera marcada sin querer.
  if (!conAnimacion) { netflixUI.classList.add("abierta"); return; }
  const ov = document.getElementById("nOverlay");
  sonidoTudum();
  ov.classList.add("activa");
  setTimeout(() => {
    netflixUI.classList.add("abierta");   // primero se muestra Jeniflix…
    ov.classList.remove("activa");        // …y hasta entonces se quita el fondo negro
  }, 2600);
}
document.getElementById("tileNetflix").addEventListener("click", () => entrarJeniflix(true));

/* en la tele: la pantalla sigue al foco, y si no hay nada enfocado
   las flechas del control empiezan por la primera película */
gridVideos.addEventListener("focusin", e => {
  const c = e.target.closest ? e.target.closest(".card-video") : null;
  if (c) { try { c.scrollIntoView({ block: "nearest", behavior: "smooth" }); } catch (err) { c.scrollIntoView(); } }
});
/* ============================================================
   🎮 NAVEGACIÓN CON EL CONTROL DE LA TELE
   Los navegadores de las smart TV mueven el foco por su cuenta, pero
   lo hacen mal con rejillas. Aquí se decide a mano a dónde va cada
   flecha, para que se pueda recorrer todo: el botón de Vistas, el de
   Inicio y cada película, fila por fila.
   ============================================================ */
function botonesCabecera() {
  return [document.getElementById("btnVistas"), document.getElementById("btnVolverFlix")]
    .filter(b => b && b.offsetParent !== null);
}

/* agrupa las películas por filas reales, según cómo quedaron en pantalla */
function filasDePeliculas() {
  const filas = [];
  [...gridVideos.querySelectorAll(".card-video")].forEach(c => {
    const arriba = Math.round(c.getBoundingClientRect().top);
    let f = filas.find(x => Math.abs(x.top - arriba) < 12);
    if (!f) { f = { top: arriba, items: [] }; filas.push(f); }
    f.items.push(c);
  });
  filas.sort((a, b) => a.top - b.top);
  return filas;
}

function irA(el) {
  if (!el) return;
  try { el.focus({ preventScroll: true }); } catch (e) { el.focus(); }
  try { el.scrollIntoView({ block: "nearest", behavior: "smooth" }); } catch (e) {}
}

netflixUI.addEventListener("keydown", e => {
  if (playerVideo.classList.contains("abierto")) return;   // el reproductor manda
  const k = e.key;

  // botón "atrás" del control: en la tele se queda en las películas,
  // que es donde ella quiere estar, en vez de salir a la portada
  if (esSmartTV() && (k === "Escape" || k === "Backspace" || e.keyCode === 461 || e.keyCode === 27)) {
    e.preventDefault();
    return;
  }

  if (!["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(k)) return;
  e.preventDefault();

  const cab = botonesCabecera();
  const filas = filasDePeliculas();
  const act = document.activeElement;
  const enCab = cab.indexOf(act);

  let fila = -1, col = -1;
  filas.forEach((f, i) => { const j = f.items.indexOf(act); if (j > -1) { fila = i; col = j; } });

  // nada seleccionado todavía: se empieza por los botones de arriba,
  // nunca por una película (así un OK de más no abre nada)
  if (enCab < 0 && fila < 0) return irA(cab[0] || (filas[0] && filas[0].items[0]));

  const enFila = (f, c) => f && (f.items[c] || f.items[f.items.length - 1]);
  let destino = null;

  if (enCab > -1) {
    if (k === "ArrowLeft")  destino = cab[enCab - 1];
    if (k === "ArrowRight") destino = cab[enCab + 1];
    if (k === "ArrowDown")  destino = filas[0] && filas[0].items[0];
  } else {
    if (k === "ArrowLeft")  destino = filas[fila].items[col - 1] || cab[0];
    if (k === "ArrowRight") destino = filas[fila].items[col + 1];
    if (k === "ArrowDown")  destino = enFila(filas[fila + 1], col);
    if (k === "ArrowUp")    destino = fila > 0 ? enFila(filas[fila - 1], col) : cab[0];
  }
  irA(destino);
});

/* los cuadros de la portada son divs: hay que hacer que el OK del control
   los active igual que un clic */
["tileNetflix", "tileSorpresa"].forEach(id => {
  const el = document.getElementById(id);
  if (!el) return;
  el.addEventListener("keydown", ev => {
    if (ev.key === "Enter" || ev.key === " " || ev.keyCode === 13) { ev.preventDefault(); el.click(); }
  });
});

/* en la portada también se navega con el control */
document.getElementById("intro").addEventListener("keydown", e => {
  if (!["ArrowLeft", "ArrowRight"].includes(e.key)) return;
  const cuadros = [...document.querySelectorAll("#tiles .tile")].filter(t => t.offsetParent !== null);
  if (!cuadros.length) return;
  e.preventDefault();
  const i = cuadros.indexOf(document.activeElement);
  if (i < 0) return irA(cuadros[0]);
  irA(cuadros[e.key === "ArrowRight" ? i + 1 : i - 1] || cuadros[i]);
});

document.getElementById("btnVistas").addEventListener("click", () => {
  mostrarVistas = !mostrarVistas;
  pintarVideos();
  // el foco se queda en el propio botón: si se dejara en una película,
  // el siguiente OK del control la abriría sin querer
  document.getElementById("btnVistas").focus();
});



/* ============================================================
   🔒 LA SORPRESA
   Aquí solo vive el conteo y el candado. Al abrirla se navega a
   galaxia.html, que es una página aparte: así ver películas no carga
   absolutamente nada de la galaxia (ni 3D, ni fotos, ni música).
   ============================================================ */
function sorpresaAbierta() {
  return CONFIG.sorpresaActiva || Date.now() >= MOMENTO_SORPRESA;
}
function desbloqueadaParaMi() { return sorpresaAbierta() || ES_ADMIN; }
const desbloqueada = desbloqueadaParaMi();   // para el resto del código (restaurar pantalla)

const tileSorpresa = document.getElementById("tileSorpresa");
const modalSorpresa = document.getElementById("modalSorpresa");
const subEl = document.getElementById("subtituloIntro");

function textoCuenta() {
  let s = Math.max(0, Math.floor((MOMENTO_SORPRESA - Date.now()) / 1000));
  const d = Math.floor(s / 86400); s -= d * 86400;
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), g = s % 60;
  const hh = String(h).padStart(2, "0"), mm = String(m).padStart(2, "0"), gg = String(g).padStart(2, "0");
  return (d ? d + (d === 1 ? " día " : " días ") : "") + hh + ":" + mm + ":" + gg;
}

function pintarEstadoSorpresa() {
  const abierta = sorpresaAbierta();
  tileSorpresa.querySelector(".candado").textContent = desbloqueadaParaMi() ? "💖" : "🔒";
  if (abierta) {
    subEl.innerText = "¡La sorpresa ya está abierta! 💖";
  } else {
    subEl.innerText = "La sorpresa se abre en " + textoCuenta() + " ⏳";
    if (modalSorpresa.classList.contains("abierta")) {
      document.getElementById("textoSorpresa").innerText = "Se abre el 12 a las 5:00 PM\n\nFalta " + textoCuenta();
    }
  }
}
pintarEstadoSorpresa();
// mientras se ve una película no hace falta repintar el conteo cada segundo:
// en la Smart TV ese trabajo constante se notaba como tironcitos en el video
setInterval(() => {
  if (playerVideo.classList.contains("abierto")) return;
  pintarEstadoSorpresa();
}, 1000);

tileSorpresa.addEventListener("click", () => {
  if (desbloqueadaParaMi()) {
    irALaGalaxia();            // la galaxia es una página aparte
    return;
  }
  document.getElementById("textoSorpresa").innerText = "Se abre el 12 a las 5:00 PM\n\nFalta " + textoCuenta();
  modalSorpresa.classList.add("abierta");
});
document.getElementById("cerrarSorpresa").addEventListener("click", () => modalSorpresa.classList.remove("abierta"));
modalSorpresa.addEventListener("click", e => { if (e.target === modalSorpresa) modalSorpresa.classList.remove("abierta"); });

/* Al recargar, volver a donde estaban. Se hace ANTES de revelar la pantalla
   (y sin transiciones) para que no se alcance a ver el inicio. */
fondoListo.then(() => {
  sinTransicion(() => {
    // En la tele se entra siempre directo a las películas: la portada solo
    // estorba con el control. En PC y celular se retoma donde estaban.
    // La galaxia nunca se retoma: siempre arranca desde la portada.
    const previa = pantallaGuardada();
    if (esSmartTV() || previa === "jeniflix" || previa === "video") entrarJeniflix(false);
    // si iOS la sacó de una película por falta de memoria, se la devolvemos
    if (previa === "video") {
      let viendo = null;
      try { viendo = localStorage.getItem("jeniflix_viendo"); } catch (e) {}
      if (viendo) setTimeout(() => {
        const v = VIDEOS.find(x => (x.fileName || x.url) === viendo);
        if (v) abrirVideo(v);
      }, 400);
    }
    document.body.classList.add("datos-listos");            // recién ahora se revela
  });
});

} /* fin iniciar() */
